name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: upscan

jobs:
  # ── 1. Validate the tag matches Cargo.toml version ──────────────────────────
  preflight:
    name: Preflight check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Cargo version
        id: version
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $CARGO_VERSION  Tag: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  # ── 2. Build matrix ──────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # macOS — Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Linux — x86_64 static (musl, runs on any distro)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz

          # Linux — ARM64 static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz

          # Windows — x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl cross-compilation tools
      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ASSET="${{ env.BINARY_NAME }}-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} .
          tar -czf "$ASSET" ${{ env.BINARY_NAME }} README.md LICENSE
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          sha256sum "$ASSET" > "${ASSET}.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ASSET = "${{ env.BINARY_NAME }}-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.zip"
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" .
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe","README.md","LICENSE" -DestinationPath $ASSET
          echo "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append
          $hash = (Get-FileHash $ASSET -Algorithm SHA256).Hash.ToLower()
          "$hash  $ASSET" | Out-File "${ASSET}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 1

  # ── 3. Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          cat << EOF > release_notes.md
          ## upscan v${VERSION}

          Scan your AWS account for idle EC2, ECS, RDS, and NAT Gateway resources and estimate potential savings from scheduling.

          ### Install

          **macOS (Homebrew)**
          \`\`\`
          brew install uptimescheduler/tap/upscan
          \`\`\`

          **Linux / macOS (direct)**
          \`\`\`bash
          # macOS Apple Silicon
          curl -L https://github.com/${{ github.repository }}/releases/download/v${VERSION}/upscan-${VERSION}-aarch64-apple-darwin.tar.gz | tar xz
          # Linux x86_64
          curl -L https://github.com/${{ github.repository }}/releases/download/v${VERSION}/upscan-${VERSION}-x86_64-unknown-linux-musl.tar.gz | tar xz
          \`\`\`

          **Cargo**
          \`\`\`
          cargo install upscan
          \`\`\`

          ### SHA-256 checksums
          \`\`\`
          $(cat artifacts/*.sha256)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "upscan v${{ needs.preflight.outputs.version }}"
          body_path: release_notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          draft: false
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}

  # ── 4. Update Homebrew tap ───────────────────────────────────────────────────
  homebrew:
    name: Update Homebrew tap
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts for SHA computation
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Compute Homebrew SHAs
        id: shas
        run: |
          ARM_SHA=$(grep "aarch64-apple-darwin" artifacts/*.sha256 | awk '{print $1}')
          X86_SHA=$(grep "x86_64-apple-darwin" artifacts/*.sha256 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: uptimescheduler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ARM_SHA: ${{ steps.shas.outputs.arm_sha }}
          X86_SHA: ${{ steps.shas.outputs.x86_sha }}
          REPO: ${{ github.repository }}
        run: |
          cat > homebrew-tap/Formula/upscan.rb << FORMULA
          # frozen_string_literal: true

          class Upscan < Formula
            desc "Scan AWS accounts for idle resources and estimate Uptime Scheduler savings"
            homepage "https://uptimescheduler.com"
            version "${VERSION}"
            license "BUSL-1.1"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/upscan-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/upscan-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_SHA}"
              end
            end

            def install
              bin.install "upscan"
            end

            test do
              assert_match "upscan", shell_output("#{bin}/upscan --version")
            end
          end
          FORMULA

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/upscan.rb
          git diff --cached --quiet && echo "Formula unchanged" && exit 0
          git commit -m "upscan ${{ needs.preflight.outputs.version }}"
          git push

