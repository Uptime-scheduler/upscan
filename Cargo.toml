[package]
name = "upscan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "upscan"
path = "src/main.rs"

[dependencies]
aws-config = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-ec2 = "1"
aws-sdk-ecs = "1"
aws-sdk-rds = "1"
aws-sdk-costexplorer = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures = "0.3"
